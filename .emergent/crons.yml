crons:
  - name: weekly-digest
    description: "Checks every 30 min and sends each commercial company's weekly digest at its configured time"
    cron: "*/30 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/weekly-digest"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    method: POST
    enabled: true
  - name: labour-cost-weekly
    description: "Emails the branded labour cost PDF to each enterprise owner every Saturday 6 PM IST"
    cron: "0 18 * * 6"
    timezone: "Asia/Kolkata"
    endpoint: "{{BASE_URL}}/api/cron/labour-cost"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    method: POST
    enabled: true
  - name: tool-overdue-daily
    description: "Sends daily 9 AM IST push + email reminders for tools past their expected return date"
    cron: "0 9 * * *"
    timezone: "Asia/Kolkata"
    endpoint: "{{BASE_URL}}/api/cron/tool-overdue"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    method: POST
    enabled: true
  - name: subscription-reminders-daily
    description: "Daily 10 AM IST trial/subscription expiry reminder emails (7/3/1 days before, then every 3 days after expiry)"
    cron: "0 10 * * *"
    timezone: "Asia/Kolkata"
    endpoint: "{{BASE_URL}}/api/cron/subscription-reminders"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    method: POST
    enabled: true
